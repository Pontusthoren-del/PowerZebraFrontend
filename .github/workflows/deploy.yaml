name: Frontend CD

on:
  push:
    branches:
      - main

env: 
  APP_NAME: meetly-frontend
  IMAGE_NAME: meetlyfrontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
       
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: Meetly.Frontend
          push: true
          tags: viktorandersson/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: VITE_API_URL=${{ vars.VITE_API_URL }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with: 
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: viktorandersson/${{ env.IMAGE_NAME }}:${{ github.sha }}