name: Frontend CD

on:
    push:
        branches:
            - main

permissions:
    contents: read
    id-token: write

env:
    APP_NAME: meetly-frontend
    ACR_NAME: ${{ vars.ACR_NAME }}
    AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Sign in to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Build and push Docker image
              id: build-image
              run: |
                  if [[ -z "$ACR_NAME" ]]; then
                    echo "::error::Set the ACR_NAME repository variable."
                    exit 1
                  fi

                  az acr login --name "$ACR_NAME"

                  image="${ACR_NAME}.azurecr.io/${APP_NAME}:${GITHUB_SHA}"
                  docker build --pull \
                    --file Meetly.Frontend/Dockerfile \
                    --tag "$image" \
                    Meetly.Frontend
                  docker push "$image"
                  echo "image=$image" >> "$GITHUB_OUTPUT"

            - name: Configure and restart Azure Web App
              env:
                  IMAGE: ${{ steps.build-image.outputs.image }}
              run: |
                  if [[ -z "$AZURE_RESOURCE_GROUP" ]]; then
                    echo "::error::Set the AZURE_RESOURCE_GROUP repository variable."
                    exit 1
                  fi

                  az webapp config set \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --name "$APP_NAME" \
                    --generic-configurations '{"acrUseManagedIdentityCreds": true}'

                  az webapp config container set \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --name "$APP_NAME" \
                    --container-image-name "$IMAGE" \
                    --container-registry-url "https://${ACR_NAME}.azurecr.io"

                  az webapp config appsettings set \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --name "$APP_NAME" \
                    --settings WEBSITES_PORT=8080

                  az webapp restart \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --name "$APP_NAME"
